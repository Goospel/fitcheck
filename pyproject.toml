[project]
name = "fitcheck"
version = "0.1.0"
description = "AI 가상 피팅 서비스 FitCheck 백엔드"
requires-python = ">=3.12"

# 의존성 추가는 팀에 알린 뒤 (CLAUDE.md 3절)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "supabase>=2.10",        # Storage 서명 URL 용도
    "replicate>=1.0",
    "python-multipart>=0.0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
